services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { const s = rs.status(); quit(s.ok && s.myState === 1 ? 0 : 1) } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); quit(1) }\"",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: credits
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    build: .
    command: ["celery", "-A", "app.celery_app.celery", "worker", "--loglevel=INFO"]
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: credits
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s
